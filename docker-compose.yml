services:
  postgres:
    image: postgres:16-alpine
    container_name: washgo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-washgo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - washgo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-washgo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - washgo_network

  washgo-be:
    build:
      context: ./washgo-be
      dockerfile: Dockerfile
    container_name: washgo_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=${POSTGRES_DB:-washgo_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123456};Include Error Detail=true;
      - App__CorsOrigins=http://localhost:5173,http://localhost:3000,http://127.0.4.1:5173,http://127.0.0.1:3000
      - Jwt__SecretKey=${JWT_SECRET_KEY:-WashGo_Super_Secret_Key_For_Jwt_Token_Generation_2026!#@$}
      - Email__Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Email__Smtp__Port=${SMTP_PORT:-587}
      - Email__Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - Email__Smtp__SenderAddress=${SMTP_SENDER_ADDRESS:-toan008888@gmail.com}
      - Email__Smtp__SenderName=${SMTP_SENDER_NAME:-Hệ thống WashGo}
      - Email__Smtp__Username=${SMTP_USERNAME:-toan008888@gmail.com}
      - Email__Smtp__Password=${SMTP_PASSWORD}
    ports:
      - "${BE_PORT:-5000}:8080"
    volumes:
      - washgo_uploads:/app/uploads
    networks:
      - washgo_network

networks:
  washgo_network:
    driver: bridge

volumes:
  washgo_postgres_data:
    driver: local
  washgo_uploads:
    driver: local
